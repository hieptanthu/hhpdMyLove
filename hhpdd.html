<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Video Background</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        height: 100%;
      }

      #background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        border: none;
        object-fit: cover;
      }

      .content {
        position: relative;
        z-index: 1;
        color: white;
        text-align: center;
        font-size: 2rem;
        padding: 50px;
      }

     
    </style>
  </head>
  <body>

    <!-- Phần nhạc -->
    <audio id="player" loop>
      <source src="./hppd.mp3" type="audio/mp3" />
    </audio>

    <video autoplay loop muted id="background-video">
      <source src="./video/banPhaoHoa.mp4" type="video/mp4" />
    </video>

    <div class="content">
      <h1>Chào mừng em yêu tới tuổi 18</h1>
    </div>

    <script>
       // Ẩn phần .content sau 3 giây
        setTimeout(function () {
          document.querySelector(".content").style.display = "none";
        }, 3000); // 3000ms = 3 giây

        // Tự động phát âm thanh khi trang web load
        window.onload = function() {
          var player = document.getElementById('player');
          player.play(); // Phát âm thanh
        };
    </script>

  </body>
</html>
