<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Video Background</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        border: none;
      }

      .content {
        position: relative;
        z-index: 1;
        color: white;
        text-align: center;
        font-size: 2rem;
        padding: 50px;
      }

      .play-button {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 2;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- 3. Phần nhạc -->
    <audio id="player" autoplay loop>
      <source src="./hppd.mp3" type="audio/mp3" />
    </audio>
    <!-- Nhúng video YouTube và tự động phát khi trang được tải -->
    <iframe
      id="background-video"
      src="https://www.youtube.com/embed/w9sbPZEB2HY?autoplay=1&loop=1&playlist=w9sbPZEB2HY&controls=0&showinfo=0&modestbranding=1"
      allow="autoplay; fullscreen"
      allowfullscreen
    ></iframe>

    <div class="content">
      <h1>Chào mừng em yêu tới tuổi 18</h1>
    </div>

    <script>
      // Ẩn phần .content sau 3 giây
      setTimeout(function () {
        document.querySelector(".content").style.display = "none";
      }, 3000); // 3000ms = 3 giây
    </script>
  </body>
</html>
