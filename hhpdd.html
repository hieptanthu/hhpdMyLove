<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fullscreen YouTube Video Background</title>
    <style>
      body {
        margin: 0;
        overflow: hidden; /* Ẩn thanh cuộn */
      }

      #background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        border: none;
      }

      .content {
        position: relative;
        z-index: 1;
        color: white;
        text-align: center;
        font-size: 2rem;
        padding: 50px;
      }
    </style>
  </head>
  <body>
    <!-- Nhúng video YouTube -->
    <iframe
      id="background-video"
      src="https://www.youtube.com/embed/euutqwJE1Ds?autoplay=1&mute=1&loop=1&playlist=euutqwJE1Ds&start=82&controls=0&showinfo=0&modestbranding=1"
      allow="autoplay; fullscreen"
      allowfullscreen
    ></iframe>

    <div class="content">
      <h1>Chào mừng em yêu tới tuổi 18</h1>
    </div>
  </body>
</html>
