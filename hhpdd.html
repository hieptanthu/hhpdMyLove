<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Video Background</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        height: 100%;
      }

      #background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        border: none;
      }

      .content {
        position: relative;
        z-index: 1;
        color: white;
        text-align: center;
        font-size: 2rem;
        padding: 50px;
      }

      .start-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px 30px;
        font-size: 1.5rem;
        border: none;
        cursor: pointer;
        z-index: 2;
      }
    </style>
  </head>
  <body>

    <!-- Phần nhạc -->
    <audio id="player" loop>
      <source src="./hppd.mp3" type="audio/mp3" />
    </audio>

    <!-- Nhúng video YouTube -->
    <iframe
      id="background-video"
      src="https://www.youtube.com/embed/w9sbPZEB2HY?autoplay=1&loop=1&playlist=w9sbPZEB2HY&controls=0&showinfo=0&modestbranding=1"
      allow="autoplay; fullscreen"
      allowfullscreen
    ></iframe>

    <div class="content">
      <h1>Chào mừng em yêu tới tuổi 18</h1>
    </div>

    <!-- Nút để bắt đầu video và âm thanh -->
    <button class="start-button" onclick="startMedia()">Bắt đầu</button>

    <script>
      // Hàm bắt đầu video và âm thanh sau khi người dùng tương tác
      function startMedia() {
        var audio = document.getElementById('player');
        var iframe = document.getElementById('background-video');

        // Phát âm thanh
        audio.play();

        // Bắt đầu video (không cần thêm code YouTube API, iframe sẽ tự động xử lý autoplay)
        iframe.src = "https://www.youtube.com/embed/w9sbPZEB2HY?autoplay=1&loop=1&playlist=w9sbPZEB2HY&controls=0&showinfo=0&modestbranding=1";

        // Ẩn nút bắt đầu sau khi nhấn
        document.querySelector(".start-button").style.display = "none";
      }

      // Ẩn phần .content sau 3 giây
      setTimeout(function () {
        document.querySelector(".content").style.display = "none";
      }, 3000); // 3000ms = 3 giây
      startMedia() 
    </script>

  </body>
</html>
